# Railway: set Service → Settings → Root Directory = `backend`
# If the repo root is used as context, set Config-as-code path to `/backend/railway.toml`
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
# Railway allows only a single pre-deploy command (one string or one array element).
preDeployCommand = "flask db upgrade"
