# Railway: Root Directory = `frontend`. Config path if needed: `/frontend/railway.toml`
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["frontend/**"]

[deploy]
# startCommand omitted — image CMD runs `serve` on 0.0.0.0:$PORT
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
